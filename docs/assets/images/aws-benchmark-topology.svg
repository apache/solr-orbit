<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400"
     role="img" aria-labelledby="awstop-title awstop-desc" font-family="Raleway, Helvetica Neue, Arial, sans-serif">
  <title id="awstop-title">What a cloud run provisions on AWS</title>
  <desc id="awstop-desc">Inside one subnet and availability zone, launchr creates a driver instance and
    two Solr instances. A standalone ZooKeeper container runs alongside Solr on the first node, not on a
    separate instance. The driver reads the corpus from its own EBS volume and drives load at the Solr
    nodes over private addresses; each Solr node stores its index on a dedicated EBS volume. The
    orchestrator sits outside the VPC and reaches the instances over SSH and the Solr admin port, both
    restricted to its own address. Reports are written to S3.</desc>
  <!-- An explicit canvas: without it the diagram is transparent, and its dark
       labels disappear against a dark background wherever it is embedded. -->
  <rect id="bg" width="860" height="400" fill="#ffffff"/>

  <defs>
    <marker id="aw-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <marker id="aw-arrow-o" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9411E"/>
    </marker>
  </defs>

  <!-- orchestrator, outside the VPC -->
  <rect x="12" y="150" width="128" height="76" rx="5" fill="#f9f8f8" stroke="#d1d3d4"/>
  <text x="76" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#262130">your host</text>
  <text x="76" y="193" text-anchor="middle" font-size="10" fill="#666666">launchr</text>
  <text x="76" y="209" text-anchor="middle" font-size="10" fill="#666666">reportr</text>

  <!-- VPC / subnet boundary -->
  <rect x="176" y="24" width="470" height="330" rx="8" fill="#ffffff" stroke="#262130"
        stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="190" y="44" font-size="11" font-weight="600" fill="#262130">one subnet, one availability zone</text>
  <text x="190" y="60" font-size="9" fill="#666666">so no measurement crosses an AZ boundary</text>

  <!-- security group note -->
  <text x="190" y="340" font-size="9" fill="#666666">security group: SSH + 8983 from your address only; Solr and ZooKeeper ports internal</text>

  <!-- driver -->
  <rect x="198" y="92" width="166" height="118" rx="5" fill="#f9f8f8" stroke="#D9411E" stroke-width="1.4"/>
  <text x="281" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#D9411E">driver</text>
  <text x="281" y="131" text-anchor="middle" font-size="10" fill="#666666">runs solr-orbit</text>
  <rect x="212" y="142" width="138" height="24" rx="3" fill="#ffffff" stroke="#d1d3d4"/>
  <text x="281" y="158" text-anchor="middle" font-size="9" fill="#262130">corpus volume (EBS)</text>
  <text x="281" y="182" text-anchor="middle" font-size="9" fill="#666666">sized from the workloads</text>
  <text x="281" y="197" text-anchor="middle" font-size="9" fill="#666666">~85 GB per large corpus</text>

  <!-- solr node 1 -->
  <rect x="424" y="84" width="198" height="110" rx="5" fill="#ffffff" stroke="#d1d3d4"/>
  <text x="523" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#262130">solr-1</text>
  <rect x="438" y="114" width="80" height="24" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
  <text x="478" y="130" text-anchor="middle" font-size="9" fill="#262130">Solr</text>
  <rect x="528" y="114" width="80" height="24" rx="3" fill="#fff0ee" stroke="#D9411E"/>
  <text x="568" y="130" text-anchor="middle" font-size="9" fill="#8b1a0a">ZooKeeper</text>
  <rect x="438" y="148" width="170" height="22" rx="3" fill="#ffffff" stroke="#d1d3d4"/>
  <text x="523" y="163" text-anchor="middle" font-size="9" fill="#262130">index volume (EBS)</text>
  <text x="523" y="185" text-anchor="middle" font-size="9" fill="#8b1a0a">ZooKeeper is here, not on its own instance</text>

  <!-- solr node 2 -->
  <rect x="424" y="212" width="198" height="92" rx="5" fill="#ffffff" stroke="#d1d3d4"/>
  <text x="523" y="233" text-anchor="middle" font-size="12" font-weight="600" fill="#262130">solr-2</text>
  <rect x="438" y="242" width="80" height="24" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
  <text x="478" y="258" text-anchor="middle" font-size="9" fill="#262130">Solr</text>
  <rect x="438" y="272" width="170" height="22" rx="3" fill="#ffffff" stroke="#d1d3d4"/>
  <text x="523" y="287" text-anchor="middle" font-size="9" fill="#262130">index volume (EBS)</text>

  <!-- load arrows, private network -->
  <line x1="368" y1="132" x2="420" y2="124" stroke="#D9411E" stroke-width="1.8" marker-end="url(#aw-arrow-o)"/>
  <line x1="368" y1="166" x2="420" y2="248" stroke="#D9411E" stroke-width="1.8" marker-end="url(#aw-arrow-o)"/>
  <text x="372" y="208" font-size="9" fill="#D9411E" font-weight="600">load, over</text>
  <text x="372" y="220" font-size="9" fill="#D9411E" font-weight="600">private IPs</text>

  <!-- zk link -->
  <line x1="523" y1="194" x2="523" y2="212" stroke="#666666" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- control arrows -->
  <line x1="144" y1="176" x2="194" y2="140" stroke="#666666" stroke-width="1.3" marker-end="url(#aw-arrow)"/>
  <text x="120" y="130" font-size="9" fill="#666666">SSH</text>

  <!-- S3 -->
  <rect x="680" y="150" width="166" height="76" rx="5" fill="#f9f8f8" stroke="#d1d3d4"/>
  <text x="763" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#262130">S3</text>
  <text x="763" y="193" text-anchor="middle" font-size="10" fill="#666666">reports + trends site</text>
  <text x="763" y="209" text-anchor="middle" font-size="10" fill="#666666">outlives the instances</text>
  <line x1="368" y1="112" x2="676" y2="160" stroke="#666666" stroke-width="1.2"
        stroke-dasharray="4 3" marker-end="url(#aw-arrow)"/>

  <text x="12" y="382" font-size="10" fill="#666666">
    Everything inside the dashed boundary is created at the start of a session and destroyed at the end. Only what reached S3 survives.
  </text>
</svg>
