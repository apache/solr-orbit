<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330"
     role="img" aria-labelledby="cbflow-title cbflow-desc" font-family="Raleway, Helvetica Neue, Arial, sans-serif">
  <title id="cbflow-title">How launchr and reportr fit together</title>
  <desc id="cbflow-desc">launchr expands launchr.yaml into a matrix of cells. For each cell it
    provisions infrastructure, deploys Solr, invokes solr-orbit to run the benchmark, and writes an
    enriched report to a storage backend. reportr reads that storage and emits a static trends site.</desc>
  <!-- An explicit canvas: without it the diagram is transparent, and its dark
       labels disappear against a dark background wherever it is embedded. -->
  <rect id="bg" width="880" height="330" fill="#ffffff"/>

  <defs>
    <marker id="cb-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <!-- ─── Stage 1: configuration ─────────────────────────────────────── -->
  <rect x="12" y="104" width="124" height="58" rx="5" fill="#f9f8f8" stroke="#d1d3d4"/>
  <text x="74" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#262130">launchr.yaml</text>
  <text x="74" y="147" text-anchor="middle" font-size="11" fill="#666666">what to measure</text>

  <line x1="140" y1="133" x2="176" y2="133" stroke="#666666" stroke-width="1.5" marker-end="url(#cb-arrow)"/>

  <!-- ─── Stage 2: the matrix ────────────────────────────────────────── -->
  <rect x="180" y="40" width="192" height="250" rx="6" fill="#ffffff" stroke="#D9411E" stroke-width="1.5"/>
  <text x="276" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#D9411E">launchr</text>
  <text x="276" y="80" text-anchor="middle" font-size="11" fill="#666666">expands into cells</text>

  <!-- cell grid -->
  <g font-size="10" fill="#262130" text-anchor="middle">
    <rect x="196" y="94" width="76" height="26" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
    <text x="234" y="111">9.7 · taxis</text>
    <rect x="280" y="94" width="76" height="26" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
    <text x="318" y="111">9.11 · taxis</text>
    <rect x="196" y="126" width="76" height="26" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
    <text x="234" y="143">10.0 · taxis</text>
    <rect x="280" y="126" width="76" height="26" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
    <text x="318" y="143">main · taxis</text>
  </g>

  <!-- per-cell lifecycle -->
  <text x="276" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#666666">each cell</text>
  <g font-size="10" fill="#262130" text-anchor="middle">
    <rect x="196" y="188" width="160" height="22" rx="3" fill="#ffffff" stroke="#d1d3d4"/>
    <text x="276" y="203">deploy Solr · health-check</text>
    <rect x="196" y="216" width="160" height="22" rx="3" fill="#ffffff" stroke="#d1d3d4"/>
    <text x="276" y="231">solr-orbit run</text>
    <rect x="196" y="244" width="160" height="22" rx="3" fill="#ffffff" stroke="#d1d3d4"/>
    <text x="276" y="259">enrich · undeploy</text>
  </g>

  <line x1="376" y1="165" x2="420" y2="165" stroke="#666666" stroke-width="1.5" marker-end="url(#cb-arrow)"/>

  <!-- ─── Stage 3: infrastructure ────────────────────────────────────── -->
  <rect x="424" y="40" width="170" height="124" rx="6" fill="#ffffff" stroke="#d1d3d4"/>
  <text x="509" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#262130">provisioned once</text>
  <text x="509" y="78" text-anchor="middle" font-size="11" fill="#666666">per profile group</text>
  <g font-size="10" fill="#262130" text-anchor="middle">
    <rect x="438" y="90" width="64" height="24" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
    <text x="470" y="106">driver</text>
    <rect x="516" y="90" width="64" height="24" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
    <text x="548" y="106">Solr</text>
    <rect x="516" y="120" width="64" height="24" rx="3" fill="#f9f8f8" stroke="#d1d3d4"/>
    <text x="548" y="136">Solr</text>
  </g>
  <text x="470" y="140" text-anchor="middle" font-size="9" fill="#666666">runs the load</text>

  <!-- storage -->
  <rect x="424" y="196" width="170" height="70" rx="6" fill="#f9f8f8" stroke="#d1d3d4"/>
  <text x="509" y="219" text-anchor="middle" font-size="12" font-weight="600" fill="#262130">result store</text>
  <text x="509" y="236" text-anchor="middle" font-size="10" fill="#666666">local directory or S3</text>
  <text x="509" y="252" text-anchor="middle" font-size="10" fill="#666666">one report per cell, immutable</text>

  <line x1="356" y1="255" x2="420" y2="240" stroke="#666666" stroke-width="1.5" marker-end="url(#cb-arrow)"/>
  <line x1="598" y1="231" x2="640" y2="231" stroke="#666666" stroke-width="1.5" marker-end="url(#cb-arrow)"/>

  <!-- ─── Stage 4: reportr ───────────────────────────────────────────── -->
  <rect x="644" y="196" width="224" height="70" rx="6" fill="#ffffff" stroke="#D9411E" stroke-width="1.5"/>
  <text x="756" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#D9411E">reportr</text>
  <text x="756" y="238" text-anchor="middle" font-size="10" fill="#666666">reads every stored report</text>
  <text x="756" y="254" text-anchor="middle" font-size="10" fill="#666666">emits a static trends site</text>

  <rect x="644" y="78" width="224" height="86" rx="6" fill="#f9f8f8" stroke="#d1d3d4"/>
  <text x="756" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#262130">trends site</text>
  <polyline points="668,146 696,134 724,138 752,120 780,124 808,108 840,112"
            fill="none" stroke="#D9411E" stroke-width="2"/>
  <line x1="662" y1="152" x2="846" y2="152" stroke="#d1d3d4"/>
  <text x="756" y="166" text-anchor="middle" font-size="9" fill="#666666">one point per run, over time</text>

  <line x1="756" y1="192" x2="756" y2="170" stroke="#666666" stroke-width="1.5" marker-end="url(#cb-arrow)"/>

  <!-- footnote -->
  <text x="12" y="312" font-size="10" fill="#666666">
    solr-orbit measures one cluster once. launchr decides what to measure and where; reportr decides how to read it.
  </text>
</svg>