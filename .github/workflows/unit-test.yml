name: Run Unit Tests
on:
  workflow_dispatch:
  pull_request:
    # Skip the test matrix for changes that cannot affect Python behaviour.
    # This is a deny-list on purpose: anything not listed here still runs the
    # tests, so a newly added source directory is never silently skipped.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.asf.yaml'
      - '.fossa.yml'
      - 'LICENSE'
      - 'NOTICE'
      # The docs site is validated by docs-lint.yml instead.
      - 'docs/**'

concurrency:
  # Cancel a PR run that has been superseded by a newer push to the same PR.
  # Pushes to main (and manual dispatches) are never cancelled: they are not
  # superseded by anything, and a half-finished main build hides breakage.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  Unit-Tests:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install bz2 development package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev

      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Run the CI build script
        run: bash .ci/build.sh build_and_unit_test
