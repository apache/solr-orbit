name: Docker Build
on:
  pull_request:
    # The build context is the whole repo, so this is a deny-list of files
    # that cannot affect the image.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.asf.yaml'
      - '.fossa.yml'
      - 'LICENSE'
      - 'NOTICE'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        required: true
        default: warning
        type: choice
        options:
          - info
          - warning
          - debug

concurrency:
  # Cancel a PR run that has been superseded by a newer push to the same PR.
  # Pushes to main (and manual dispatches) are never cancelled: they are not
  # superseded by anything, and a half-finished main build hides breakage.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ['linux/amd64', 'linux/arm64']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        # Workaround for a memory allocation layout bug in QEMU,
        # triggered by a kernel update to Linux machine images.
        # Note that this is not an actual fix.
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker Build ${{ matrix.platform }}
        run: |
            docker buildx version
            tag=asb/asb-`echo ${{ matrix.platform }} | tr '/' '-'`
            set -x
            docker buildx build --platform ${{ matrix.platform }} --build-arg VERSION=`cat version.txt` --build-arg BUILD_DATE=`date -u +%Y-%m-%dT%H:%M:%SZ` -f docker/Dockerfile -t "$tag" -o type=docker .
            set +x
            docker images | grep "$tag"
