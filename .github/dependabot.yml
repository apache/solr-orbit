version: 2
updates:
  # Python dependencies are managed by uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Keeps the pinned uv image (ghcr.io/astral-sh/uv) in docker/Dockerfile up to date
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
