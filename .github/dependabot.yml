version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Keeps the pinned uv image (ghcr.io/astral-sh/uv) in docker/Dockerfile up to date
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
